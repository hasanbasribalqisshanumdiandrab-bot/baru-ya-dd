<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard Performance Toko · Area Hasan</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

:root {
  --bg: #F3EDF7;
  --card: #FFFFFF;
  --c2: #F8F5FA;
  --line: #E5DDF0;
  --ink: #1D192B;
  --mut: #79747E;
  
  --vi: #6750A4;
  --cy: #006A6A;
  --pk: #B3261E;
  --g: #10B981;
  --r: #EF4444;
  --y: #F59E0B;
  --b: #3B82F6;
  
  --grad-primary: linear-gradient(135deg, #6750A4 0%, #D0BCFF 100%);
  --grad-card: linear-gradient(180deg, rgba(255,255,255,1) 0%, rgba(248,245,250,1) 100%);
}

* { box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }

body {
  margin: 0;
  background: var(--bg);
  background-image: 
    radial-gradient(at 0% 0%, rgba(103, 80, 164, 0.15) 0px, transparent 50%),
    radial-gradient(at 100% 0%, rgba(208, 188, 255, 0.2) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(0, 106, 106, 0.1) 0px, transparent 50%);
  background-attachment: fixed;
  color: var(--ink);
  padding: 20px;
  min-height: 100vh;
}

.layout {
  display: grid;
  grid-template-columns: 240px 1fr;
  gap: 24px;
  max-width: 1600px;
  margin: 0 auto;
}

.sidebar {
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(12px);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  height: calc(100vh - 40px);
  position: sticky;
  top: 20px;
}

.profile {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line);
}
.avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--grad-primary);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 18px;
  box-shadow: 0 4px 12px rgba(103, 80, 164, 0.3);
}
.profile-info h3 { margin: 0; font-size: 16px; font-weight: 700; }
.profile-info p { margin: 2px 0 0; font-size: 12px; color: var(--mut); }

.nav-menu { display: flex; flex-direction: column; gap: 8px; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  border-radius: 12px;
  color: var(--mut);
  text-decoration: none;
  font-weight: 600;
  font-size: 14px;
  border: none;
  background: none;
  cursor: pointer;
  width: 100%;
  text-align: left;
  transition: all 0.2s ease;
}
.nav-item:hover { background: rgba(103, 80, 164, 0.05); color: var(--vi); }
.nav-item.active { background: var(--vi); color: white; box-shadow: 0 4px 12px rgba(103, 80, 164, 0.25); }
.nav-item i-lucide { width: 18px; height: 18px; }

.main-content { display: flex; flex-direction: column; gap: 20px; }

.filters {
  display: flex;
  gap: 12px;
  background: rgba(255, 255, 255, 0.75);
  backdrop-filter: blur(12px);
  padding: 16px 24px;
  border-radius: 20px;
  border: 1px solid var(--line);
  align-items: center;
}
select, .btn {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 10px 16px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: white;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.2s;
  outline: none;
}
select:focus, .btn:hover { border-color: var(--vi); box-shadow: 0 0 0 3px rgba(103, 80, 164, 0.1); }
.btn.primary { background: var(--vi); color: white; border: none; display: flex; align-items: center; gap: 8px; }
.btn.primary:hover { background: #5A4491; box-shadow: 0 4px 12px rgba(103, 80, 164, 0.3); }

.live-status {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--mut);
  background: white;
  padding: 8px 16px;
  border-radius: 99px;
  border: 1px solid var(--line);
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--g); animation: pulse 2s infinite; }
.dot.error { background: var(--r); animation: none; }
.dot.loading { background: var(--y); animation: pulse 1s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4); } 70% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }

.kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; }
.kpi-card {
  background: white;
  border-radius: 16px;
  padding: 16px;
  border: 1px solid var(--line);
  position: relative;
  overflow: hidden;
  transition: transform 0.2s;
}
.kpi-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(103, 80, 164, 0.08); }
.kpi-card h4 { margin: 0 0 8px; font-size: 13px; color: var(--mut); font-weight: 600; text-transform: uppercase; }
.kpi-card .val { font-size: 28px; font-weight: 800; color: var(--ink); margin-bottom: 4px; }
.kpi-card .target { font-size: 12px; color: var(--mut); font-weight: 500; }
.kpi-card .progress-bar { height: 6px; background: var(--line); border-radius: 99px; margin-top: 12px; overflow: hidden; }
.kpi-card .progress-fill { height: 100%; background: var(--grad-primary); border-radius: 99px; }
.kpi-card.total-card { background: var(--grad-primary); color: white; border: none; }
.kpi-card.total-card h4, .kpi-card.total-card .val, .kpi-card.total-card .target { color: white; }
.kpi-card.total-card .progress-bar { background: rgba(255,255,255,0.2); }
.kpi-card.total-card .progress-fill { background: white; }

.table-container { background: white; border-radius: 20px; border: 1px solid var(--line); overflow-x: auto; }
table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; min-width: 1100px; }
th { background: var(--c2); color: var(--mut); font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; padding: 16px; border-bottom: 1px solid var(--line); text-align: center; }
td { padding: 12px 16px; border-bottom: 1px solid var(--line); text-align: center; vertical-align: middle; font-weight: 500; }
tbody tr:hover { background: rgba(103, 80, 164, 0.03); }

.text-left { text-align: left; }
.store-name { font-weight: 700; font-size: 14px; color: var(--ink); margin-bottom: 2px; }
.store-code { font-size: 11px; color: var(--mut); font-weight: 600; }

.badge { display: inline-flex; align-items: center; padding: 6px 12px; border-radius: 99px; font-size: 11px; font-weight: 700; line-height: 1; }
.bg-green { background: #DCFCE7; color: #166534; }
.bg-blue { background: #DBEAFE; color: #1E40AF; }
.bg-yellow { background: #FEF3C7; color: #92400E; }
.bg-red { background: #FEE2E2; color: #991B1B; }
.bg-purple { background: #F3E8FF; color: #6B21A8; }

.rank-text { font-weight: 800; color: var(--vi); }
.alert-text { color: var(--r); font-weight: 800; }
.alert-bg { background: #FEE2E2; padding: 4px 8px; border-radius: 8px; color: #991B1B; display: inline-block;}
.good-text { color: var(--g); font-weight: 800; }

.val-box { font-weight: 800; font-size: 15px; }
.val-box span { display: block; font-size: 10px; color: var(--mut); font-weight: 600; margin-top: 2px; }

#cap { display: none; }
#msg { display: flex; align-items: center; justify-content: center; height: 60vh; color: var(--vi); font-weight: 600; font-size: 16px; }


/* ===== POLISH V21: readable, responsive and export-ready ===== */
#cap { display:block; }
.export-head { display:flex; justify-content:space-between; align-items:center; gap:16px; padding:22px 24px; margin-bottom:16px; border-radius:20px; color:#fff; background:linear-gradient(115deg,#34206f 0%,#6750a4 58%,#a78bfa 100%); box-shadow:0 12px 30px rgba(74,48,130,.16); }
.export-head h1 { margin:0; font-size:clamp(18px,2.2vw,27px); letter-spacing:.2px; font-weight:800; }
.export-head p { margin:5px 0 0; color:rgba(255,255,255,.82); font-size:12px; font-weight:600; }
.export-meta { text-align:right; font-size:12px; line-height:1.7; color:rgba(255,255,255,.9); }
.section-title { display:flex; align-items:center; gap:10px; margin:18px 0 10px; color:#4b328a; font-weight:800; font-size:14px; letter-spacing:.5px; text-transform:uppercase; }
.section-title:before { content:""; width:5px; height:20px; border-radius:8px; background:var(--vi); }
.table-container { box-shadow:0 5px 18px rgba(46,30,78,.035); }
th { position:sticky; top:0; z-index:1; }
td { line-height:1.35; }
tbody tr:last-child td { border-bottom:0; }
.store-name { overflow-wrap:anywhere; }
.filters { flex-wrap:wrap; }
#msg { min-height:180px; height:auto; padding:30px; text-align:center; background:#fff; border:1px solid var(--line); border-radius:20px; }
.btn:disabled { opacity:.55; cursor:wait; }
.footer-note { margin-top:16px; padding:13px 18px; border-radius:14px; background:#f0eafb; color:#5c478c; font-size:12px; font-weight:700; text-align:center; }
@media(max-width:640px) {
 body { padding:10px; }
 .layout { gap:12px; }
 .sidebar { border-radius:16px; gap:12px; }
 .profile { padding-right:10px; }
 .profile-info h3 { font-size:14px; }
 .nav-item { padding:10px 12px; font-size:12px; }
 .filters { padding:12px; border-radius:16px; }
 .live-status { margin-left:0; width:100%; justify-content:center; }
 .kpi-grid { gap:9px; }
 .kpi-card { padding:12px; border-radius:14px; }
 .kpi-card .val { font-size:23px; }
 .export-head { padding:16px; align-items:flex-start; }
 .export-meta { font-size:10px; }
}
@media print {
 body { padding:0; background:#fff; }
 .sidebar,.filters { display:none!important; }
 .layout { display:block; }
 .main-content { gap:0; }
}

@media(max-width: 1024px) {
  .layout { grid-template-columns: 1fr; }
  .sidebar { height: auto; position: static; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 16px; }
  .profile { border-bottom: none; border-right: 1px solid var(--line); padding-bottom: 0; padding-right: 20px; }
  .nav-menu { flex-direction: row; flex: 1; overflow-x: auto; }
  .nav-item { width: auto; white-space: nowrap; }
  .kpi-grid { grid-template-columns: repeat(3, 1fr); }
}
@media(max-width: 640px) {
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .filters { flex-wrap: wrap; }
  select, .btn { flex: 1; }
}
</style>
</head>
<body>

<div class="layout">
  <aside class="sidebar">
    <div class="profile">
      <div class="avatar">AH</div>
      <div class="profile-info">
        <h3>Area Hasan</h3>
        <p>Dashboard Monitoring</p>
      </div>
    </div>
    <div class="nav-menu" id="tabs">
      <button class="nav-item active" data-t="prod">
        <i data-lucide="bar-chart-2"></i> Produktivitas
      </button>
      <button class="nav-item" data-t="mem">
        <i data-lucide="gift"></i> Member & Fair
      </button>
      <button class="nav-item" data-t="acc">
        <i data-lucide="calendar-days"></i> Akumulasi Bulan
      </button>
    </div>
    
    <div style="margin-top: auto; border-top: 1px solid var(--line); padding-top: 20px; display:flex; flex-direction:column; gap:8px;">
        <a class="btn" id="xls" target="_blank" style="text-decoration:none; text-align:center;">
          <i data-lucide="file-spreadsheet" style="vertical-align: middle; width: 16px; height: 16px; margin-right: 4px;"></i> Spreadsheet
        </a>
    </div>
  </aside>

  <main class="main-content">
    <div class="filters">
      <select id="tgl"></select>
      <select id="jam"></select>
      <button class="btn" onclick="refresh()">
        <i data-lucide="refresh-cw" style="vertical-align: middle; width: 14px; height: 14px;"></i>
      </button>
      <button class="btn primary" onclick="dl()">
        <i data-lucide="download"></i> Download Gambar
      </button>
      
      <div class="live-status">
        <span class="dot" id="dot"></span>
        <span id="upd">Sinkronisasi data...</span>
      </div>
    </div>

    <div id="msg">
        <i data-lucide="loader" style="margin-right:8px; animation: spin 1s linear infinite;"></i>
        Memuat data realtime dari Google Sheets...
    </div>
    <div id="cap"></div>
  </main>
</div>

<script>
lucide.createIcons();

/* ============ PENGATURAN (SINKRON GS & GITHUB PAGES) ============ */
const SHEET_ID='1ylxNHZGFvu2-AE_62H9qBPFuVa6CJHpTw6pfot2AaY8';
const REFRESH_DETIK=30;
const BLOCK=[7,32,57,82], JAMS=['10:00','15:00','19:00','23:00'], N=19;
// Urutan resmi dari daftar yang diberikan. Toko ke-19 (jika ada di Sheet)
// tetap dibaca otomatis dan ditempatkan setelah 18 toko yang terdaftar.
const STORE_MASTER=[
  ['Y142','pancoran'],['Y457','dadapan'],['Y015','maesan'],['Y196','grujugan'],
  ['Y469','tamanan'],['Y247','jambe'],['Y1038','prapto2'],['Y073','supriyadi'],
  ['Y207','Baratan'],['Y222','jeruk'],['Y141','suko3'],['Y200','Kalis'],
  ['Y214','wahidin'],['Y144','a.yani'],['Y116','cumedak'],['Y136','arjasa'],
  ['Y140','suko2'],['Y549','Gruu']
];
const STORE_INDEX=new Map(STORE_MASTER.map((s,i)=>[s[0],i]));
const FETCH_TIMEOUT=12000, MONTH_BATCH=5;
const TARGET={psm:150,sertis:30,pwp:50,seger:50,ceban:10}, TOTAL_T=290;
const IND=[['psm','PSM','Qty'],['sertis','SERTIS','Pkt'],['pwp','PWP','Qty'],['seger','SEGER','Qty'],['ceban','CEBAN','Pkt']];
const STATUS=[[.9,'SANGAT PRODUKTIF','bg-green'],[.7,'PRODUKTIF','bg-blue'],[.5,'KURANG PRODUKTIF','bg-yellow'],[0,'TIDAK PRODUKTIF','bg-red']];
const FAIRS=[['f1','Susu 1','bg-blue'],['f2','Susu 2','bg-green'],['f3','Diapers Fair','bg-purple']];
const COLS={psm:6,sertis:7,pwp:8,seger:9,ceban:10,pakai:11,tidak:12,nmA:15,f1R:17,f1L:18,f2R:20,f2L:21,f3R:23,f3L:24};

const $=id=>document.getElementById(id), pad=n=>('0'+n).slice(-2);
const f1=x=>(Math.round((Number(x)||0)*10)/10).toString();
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const orderedStores=rows=>rows.sort((a,b)=>{
  const ai=STORE_INDEX.has(a.kode)?STORE_INDEX.get(a.kode):999;
  const bi=STORE_INDEX.has(b.kode)?STORE_INDEX.get(b.kode):999;
  return ai-bi || String(a.nama).localeCompare(String(b.nama),'id');
});
let DATA=null, TAB='prod', MONTH=null, CACHE={};
$('xls').href='https://docs.google.com/spreadsheets/d/'+SHEET_ID+'/edit';

(function(){
  const t=$('tgl');for(let d=1;d<=31;d++)t.add(new Option('Tanggal '+pad(d),d));
  const j=$('jam');j.add(new Option('Total Harian',-1));JAMS.forEach((x,i)=>j.add(new Option('Jam '+x,i)));
  t.value=parseInt(new Date().toLocaleString('en-US',{day:'numeric',timeZone:'Asia/Jakarta'}),10);
  t.onchange=()=>{load(true)};j.onchange=render;
  
  document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    TAB=b.dataset.t;
    $('jam').style.display=TAB==='acc'?'none':'';
    $('tgl').style.display=TAB==='acc'?'none':'';
    if(TAB==='acc'&&!MONTH)loadMonth();else render();
  });
})();

/* ============ FAST PARALLEL FETCH WITH TIMEOUT ============ */
function csv(t){const R=[];let r=[],c='',q=false;
  for(let i=0;i<t.length;i++){const ch=t[i];
    if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=ch}
    else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}
    else if(ch=='\n'){r.push(c);R.push(r);r=[];c=''}else if(ch!='\r')c+=ch}
  if(c||r.length){r.push(c);R.push(r)}return R}
const num=x=>{if(x==null||x==='')return 0;const n=Number(String(x).replace(',','.'));return isNaN(n)?(parseFloat(String(x).replace(/[^\d.\-]/g,''))||0):n};

async function fetchDay(d, fresh=false){
  if(!fresh && CACHE[d]) return CACHE[d];
  const controller=new AbortController();
  const timeoutId=setTimeout(()=>controller.abort(),FETCH_TIMEOUT);
  try {
    const u=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Tgl_${pad(d)}&range=A1:AO110&_=${Date.now()}`;
    const res=await fetch(u,{signal:controller.signal,cache:'no-store'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const text=await res.text();
    if(/<!DOCTYPE html>|google-site-verification|accounts\.google\.com/i.test(text.slice(0,1500)))
      throw new Error('Sheet Tgl_'+pad(d)+' tidak dapat diakses; periksa izin Viewer.');
    const rows=csv(text);
    if(rows.length<20) throw new Error('Sheet Tgl_'+pad(d)+' kosong atau formatnya berubah.');
    const parsed=parse(rows);
    CACHE[d]=parsed;
    return parsed;
  } catch(e) {
    if(e.name==='AbortError') throw new Error('Waktu koneksi habis saat membaca Tgl '+pad(d)+'.');
    throw e;
  } finally { clearTimeout(timeoutId); }
}

function parse(rows){
  const cell=(r,c)=>(rows[r]&&rows[r][c]!=null)?rows[r][c]:'';
  const stores=[];let any=false;
  for(let i=0;i<N;i++){
    const kode=String(cell(BLOCK[0]-1+i,1)).trim().toUpperCase();
    const master=STORE_MASTER.find(x=>x[0]===kode);
    const s={kode,nama:master?master[1]:String(cell(BLOCK[0]-1+i,2)).trim(),h:[]};
    for(let b=0;b<4;b++){const r=BLOCK[b]-1+i;const h={lapor:false,staff:String(cell(r,4)).trim(),crew:String(cell(r,5)).trim()};
      for(let c=6;c<=12;c++)if(cell(r,c)!=='')h.lapor=true;
      for(const k in COLS)h[k]=num(cell(r,COLS[k]));
      if(IND.some(x=>h[x[0]]>0))any=true;s.h.push(h)}
    stores.push(s)}
  return{stores,any};
}

function agg(p,jam){
  return p.stores.map(s=>{const o={kode:s.kode,nama:s.nama,staff:'',crew:''};
    for(const k in COLS)o[k]=0;
    s.h.forEach((h,b)=>{if(jam===-1||jam===b){for(const k in COLS)o[k]+=h[k];if(h.staff)o.staff=h.staff;if(h.crew)o.crew=h.crew}});
    o.total=IND.reduce((a,x)=>a+o[x[0]],0);return o}).filter(o=>o.nama||o.kode);
}
const rankDesc=a=>a.map(v=>1+a.filter(x=>x>v).length);

let loading=false, lastLoadAt=0;
async function load(fresh=false){
  if(loading) return;
  loading=true; lastLoadAt=Date.now();
  const t=$('tgl'); let d=+t.value;
  $('dot').className='dot loading'; $('upd').textContent='Sinkronisasi Tgl '+pad(d)+'...';
  try {
    let p;
    try { p=await fetchDay(d,!!fresh); }
    catch(err) {
      const checkDays=[d-1,d-2,d-3,d-4,d-5].filter(x=>x>=1);
      const results=await Promise.allSettled(checkDays.map(k=>fetchDay(k,!!fresh)));
      const found=results.findIndex(r=>r.status==='fulfilled'&&r.value.any);
      if(found<0) throw err;
      d=checkDays[found]; p=results[found].value; t.value=d;
      $('upd').textContent='Data terbaru tersedia pada Tgl '+pad(d);
    }
    DATA={d,p};
    $('dot').className='dot';
    $('upd').textContent='Tersinkron · Tgl '+pad(d)+' · '+new Date().toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta'})+' WIB';
    render();
  } catch(e) {
    $('dot').className='dot error'; $('upd').textContent='Sinkronisasi gagal';
    $('msg').style.display='flex'; $('cap').style.display='none';
    $('msg').innerHTML=`<span style="color:var(--r)">⚠ ${esc(e.message)}<br><small style="color:var(--mut)">Pastikan spreadsheet dapat diakses sebagai Viewer dan nama sheet sesuai pola Tgl_01, Tgl_02, dst.</small></span>`;
  } finally { loading=false; }
}

function refresh(){MONTH=null;CACHE={};TAB==='acc'?loadMonth(true):load(true)}
function show(h){
  const tabName={prod:'PRODUKTIVITAS',mem:'MEMBER FAIR',acc:'AKUMULASI BULAN'}[TAB]||'MONITORING';
  const dateText=TAB==='acc'?'Rekap tanggal 01–31':`Tanggal ${pad(DATA?.d||+$('tgl').value)} · ${$('jam').selectedOptions[0]?.textContent||''}`;
  $('cap').innerHTML=`<div class="export-head"><div><h1>Dashboard Performance Toko</h1><p>MONITORING AREA · ${tabName}</p></div><div class="export-meta"><strong>${dateText}</strong><br>Data Google Sheets · ${new Date().toLocaleString('id-ID',{timeZone:'Asia/Jakarta'})} WIB</div></div>${h}<div class="footer-note">Performance Lebih Baik, Bersama Kita · Total toko dibaca otomatis dari spreadsheet</div>`;
  $('cap').style.display='block';$('msg').style.display='none';lucide.createIcons();
}
function render(){if(!DATA&&TAB!=='acc')return;({prod:rProd,mem:rMem,acc:rAcc})[TAB]()}

/* ============ TAB 1: PRODUKTIVITAS ============ */
function rProd(){
  const jam=+$('jam').value,d=DATA.d,rows=agg(DATA.p,jam);
  const rk=IND.map(x=>rankDesc(rows.map(o=>o[x[0]])));
  rows.forEach((o,i)=>o.score=rk.reduce((a,r)=>a+r[i],0));
  const rr=rankDesc(rows.map(o=>-o.score));rows.forEach((o,i)=>o.rank=rr[i]);
  rows.sort((a,b)=>b.total-a.total);
  const n=rows.length||1,avg={};IND.forEach(x=>avg[x[0]]=rows.reduce((a,o)=>a+o[x[0]],0)/n);
  const avgT=rows.reduce((a,o)=>a+o.total,0)/n,mn={},mxk={};
  IND.forEach(x=>{const v=rows.map(o=>o[x[0]]);const lo=Math.min(...v),hi=Math.max(...v);mn[x[0]]=lo<hi?lo:null;
    const sh=v.map(a=>Math.max(0,TARGET[x[0]]-a));const sm=Math.max(...sh);mxk[x[0]]=(sm>0&&sm>Math.min(...sh))?sm:null});
  const cnt=[0,0,0,0],stat=t=>{const p=t/TOTAL_T;for(let i=0;i<4;i++)if(p>=STATUS[i][0]||i==3)return i};
  
  let h=`<div class="kpi-grid">`;
  IND.forEach(x=>{const a=avg[x[0]],pc=Math.min(100,a/TARGET[x[0]]*100);
    h+=`<div class="kpi-card">
          <h4>${x[1]}</h4>
          <div class="val">${f1(a)}</div>
          <div class="target">Target: ${TARGET[x[0]]} ${x[2]} (${pc.toFixed(0)}%)</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${pc}%"></div></div>
        </div>`});
  h+=`<div class="kpi-card total-card">
        <h4>TOTAL PRODUKTIVITAS</h4>
        <div class="val">${f1(avgT)}</div>
        <div class="target">${(avgT/TOTAL_T*100).toFixed(0)}% dari Target ${TOTAL_T}</div>
        <div class="progress-bar"><div class="progress-fill" style="width:${Math.min(100, avgT/TOTAL_T*100)}%"></div></div>
      </div></div>
      
  <div class="table-container" style="margin-top:20px;">
    <table>
      <thead>
        <tr>
          <th>Toko</th>
          <th>Rank</th>
          ${IND.map(x=>`<th>${x[1]}</th>`).join('')}
          <th>Total</th>
          <th>Status</th>
          <th colspan="5">Evaluasi (Kekurangan Qty)</th>
        </tr>
      </thead>
      <tbody>`;
      
  rows.forEach((o,i)=>{const si=stat(o.total);cnt[si]++;
    h+=`<tr>
      <td class="text-left">
        <div class="store-name">${esc(o.nama)}</div>
        <div class="store-code">${esc(o.kode)} • ${esc(o.staff||'-')}/${esc(o.crew||'-')}</div>
      </td>
      <td class="rank-text">#${o.rank}</td>`;
      
    IND.forEach(x=>{const v=o[x[0]],t=TARGET[x[0]],ac=v/t*100,m=mn[x[0]]===v;
      h+=`<td><div class="val-box ${ac>=100?'good-text':''} ${m?'alert-bg':''}">${f1(v)}<span>${ac.toFixed(0)}%</span></div></td>`});
      
    h+=`<td class="val-box" style="color:var(--vi); font-size:16px;">${o.total.toFixed(1)}</td>
        <td><span class="badge ${STATUS[si][2]}">${STATUS[si][1]}</span></td>`;
        
    IND.forEach(x=>{const k=Math.max(0,TARGET[x[0]]-o[x[0]]),mx=mxk[x[0]]!==null&&k===mxk[x[0]];
      h+=`<td><div class="${k==0?'good-text':'alert-text'} ${mx?'alert-bg':''}" style="font-size:12px">${k==0?'✓':'-'+f1(k)}</div></td>`});
    h+='</tr>'});
    
  h+=`</tbody></table></div>`;
  show(h);
}

/* ============ TAB 2: MEMBER & FAIR ============ */
function rMem(){
  const jam=+$('jam').value,d=DATA.d,rows=agg(DATA.p,jam);
  const IN=[['m','MEMBER','bg-blue','pakai','tidak','Pakai','Tidak'],...FAIRS.map(f=>[f[0],f[1],f[2],f[0]+'R',f[0]+'L','Redeem','Lost'])];
  rows.forEach(o=>IN.forEach(x=>{const a=o[x[3]],b=o[x[4]];o[x[0]+'p']=a+b?a/(a+b):0;o[x[0]+'k']=(a+b)?o[x[0]+'p']+a*1e-6:-1}));
  IN.forEach(x=>{const r=rankDesc(rows.map(o=>o[x[0]+'k']));rows.forEach((o,i)=>o[x[0]+'r']=r[i])});
  rows.forEach(o=>o.skor=IN.reduce((a,x)=>a+o[x[0]+'r'],0));
  rows.sort((a,b)=>a.skor-b.skor);
  
  let h=`<div class="table-container"><table><thead><tr>
    <th class="text-left">Toko</th>
    ${IN.map(x=>`<th>${x[1]}<br><span style="font-weight:normal;font-size:10px">${x[5]} vs ${x[6]}</span></th>`).join('')}
    <th>Skor Fair</th>
  </tr></thead><tbody>`;
  
  rows.forEach((o,i)=>{
    h+=`<tr>
      <td class="text-left">
        <div class="store-name">${i+1}. ${esc(o.nama)}</div>
        <div class="store-code">${esc(o.kode)}</div>
      </td>`;
    IN.forEach(x=>{const p=o[x[0]+'p']; const col=p>=0.5?'var(--g)':'var(--r)';
      h+=`<td>
        <div class="val-box" style="color:${col}">${(p*100).toFixed(0)}%</div>
        <div style="font-size:10px; color:var(--mut); margin-top:2px;">${o[x[3]]} / ${o[x[4]]}</div>
      </td>`});
    h+=`<td class="rank-text">${o.skor}</td></tr>`});
  h+=`</tbody></table></div>`;
  show(h);
}

/* ============ TAB 3: AKUMULASI BULAN (FAST BATCH PROMISES) ============ */
async function loadMonth(force=false){
  if(loading) return;
  loading=true; $('msg').style.display='flex'; $('cap').style.display='none';
  $('msg').textContent='Mengambil data bulanan secara bertahap...';
  try {
    const days=Array(31).fill(null);
    for(let i=0;i<31;i+=MONTH_BATCH){
      const batch=Array.from({length:Math.min(MONTH_BATCH,31-i)},(_,k)=>i+k+1);
      const result=await Promise.allSettled(batch.map(d=>fetchDay(d,force)));
      result.forEach((r,k)=>{if(r.status==='fulfilled')days[batch[k]-1]=r.value;});
      $('msg').textContent=`Memproses data bulanan · ${Math.min(i+MONTH_BATCH,31)}/31 hari`;
    }
    const st={};
    days.forEach((p,di)=>{
      if(!p||!p.any)return;
      const rows=agg(p,-1), r=rankDesc(rows.map(o=>o.total));
      rows.forEach((o,i)=>{
        const key=o.kode||o.nama;
        const s=st[key]=st[key]||{nama:o.nama,kode:o.kode,tot:0,poin:0,hist:Array(31).fill(null)};
        s.tot+=o.total; s.poin+=r[i]; s.hist[di]=r[i];
      });
    });
    MONTH=Object.values(st).sort((a,b)=>a.poin-b.poin);
    $('dot').className='dot'; $('upd').textContent='Akumulasi bulanan · '+new Date().toLocaleTimeString('id-ID',{timeZone:'Asia/Jakarta'})+' WIB';
    rAcc();
  } catch(e) {
    $('dot').className='dot error'; $('upd').textContent='Gagal memuat akumulasi';
    $('msg').style.display='flex'; $('msg').textContent='Gagal memuat data bulanan: '+e.message;
  } finally { loading=false; }
}

function rAcc(){
  if(!MONTH){loadMonth();return}
  let h=`<div class="table-container"><table><thead><tr>
    <th>Rank</th><th class="text-left">Toko</th><th>Total Omset</th><th>Poin Kesalahan</th><th class="text-left">Histori Peringkat Harian (Tgl 1-31)</th>
  </tr></thead><tbody>`;
  
  MONTH.forEach((s,i)=>{
    h+=`<tr>
      <td class="no">${i+1}</td>
      <td class="text-left nm">
        <div class="store-name">${esc(s.nama)}</div>
        <div class="store-code">${esc(s.kode)}</div>
      </td>
      <td class="val-box">${f1(s.tot)}</td>
      <td class="alert-text" style="font-size:16px">${s.poin}</td>
      <td class="text-left">
        <div style="display:flex; flex-wrap:wrap; gap:2px; max-width:400px;">`+
        s.hist.map((r,d)=>r===null?`<div style="width:20px;height:20px;background:var(--line);border-radius:4px;opacity:0.5" title="Tgl ${d+1}"></div>`:
        `<div style="width:20px;height:20px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:bold;color:white;border-radius:4px;background:${r<=5?'var(--g)':r>=15?'var(--r)':'var(--y)'}" title="Tgl ${d+1}: Rank ${r}">${r}</div>`).join('')+
        `</div>
      </td>
    </tr>`});
  h+=`</tbody></table></div>`;
  show(h);
}

/* ============ DOWNLOAD IMAGE ============ */
async function dl(){
  const el=$('cap'); if(el.style.display==='none'||!el.innerHTML)return;
  const btn=document.querySelector('.btn.primary'); const old=btn.innerHTML;
  try {
    btn.disabled=true; btn.textContent='Menyiapkan gambar...';
    const canvas=await html2canvas(el,{scale:2,backgroundColor:'#F3EDF7',useCORS:true,logging:false,windowWidth:Math.max(document.documentElement.scrollWidth,el.scrollWidth)});
    const a=document.createElement('a'),jam=+$('jam').value;
    const nm={prod:'Dashboard_Produktivitas',mem:'Dashboard_Member_Fair',acc:'Dashboard_Akumulasi_Bulanan'}[TAB];
    a.download=TAB==='acc'?`${nm}.png`:`${nm}_Tgl${pad(DATA.d)}_${jam===-1?'Total':'Jam'+JAMS[jam].replace(':','')}.png`;
    a.href=canvas.toDataURL('image/png'); a.click();
  } catch(e) { alert('Gagal membuat gambar: '+e.message); }
  finally { btn.disabled=false; btn.innerHTML=old; lucide.createIcons(); }
}


load();
setInterval(()=>{if(TAB!=='acc'&&!document.hidden&&!loading)load(true)}, REFRESH_DETIK*1000);
</script>
